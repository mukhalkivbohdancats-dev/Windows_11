name: Build Windows 11 APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Windows_11.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows_11.apk
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Download the project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source android_app apk
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/mukhalkivbohdancats-dev/Windows_11/main/NovaShell11_Windows11_Project.zip" \
            -o source/NovaShell11_Windows11_Project.zip
          unzip -oq source/NovaShell11_Windows11_Project.zip -d source/extracted
          echo "Project ZIP downloaded and extracted."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: windows11-android-api24-${{ runner.os }}-${{ hashFiles('.github/workflows/Windows_11.yml') }}-${{ github.run_id }}
          restore-keys: |
            windows11-android-api24-${{ runner.os }}-${{ hashFiles('.github/workflows/Windows_11.yml') }}-
            windows11-android-api24-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake libltdl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython==0.29.36"

      - name: Generate Android-compatible app
        shell: bash
        run: |
          set -euo pipefail
          cat > android_app/main.py <<'PY'
          import ast
          import operator
          import os
          import calendar
          from datetime import datetime

          from kivy.app import App
          from kivy.clock import Clock
          from kivy.core.window import Window
          from kivy.metrics import dp, sp
          from kivy.graphics import Color, RoundedRectangle
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.gridlayout import GridLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput
          from kivy.uix.popup import Popup
          from kivy.uix.scrollview import ScrollView

          BG = (0.035, 0.055, 0.095, 1)
          PANEL = (0.085, 0.125, 0.20, 1)
          BLUE = (0.20, 0.43, 0.95, 1)
          TEXT = (0.95, 0.97, 1.0, 1)
          MUTED = (0.67, 0.73, 0.83, 1)
          GREEN = (0.20, 0.78, 0.55, 1)

          def make_card(**kwargs):
              widget = BoxLayout(**kwargs)
              with widget.canvas.before:
                  Color(*PANEL)
                  widget._background = RoundedRectangle(
                      pos=widget.pos, size=widget.size, radius=[dp(15)])
              widget.bind(
                  pos=lambda obj, value: setattr(obj._background, "pos", value),
                  size=lambda obj, value: setattr(obj._background, "size", value))
              return widget

          def calculate(expression):
              if not expression or len(expression) > 100:
                  raise ValueError("Invalid expression")
              tree = ast.parse(expression, mode="eval")
              operations = {
                  ast.Add: operator.add, ast.Sub: operator.sub,
                  ast.Mult: operator.mul, ast.Div: operator.truediv,
                  ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod,
                  ast.Pow: operator.pow,
              }
              unary = {ast.UAdd: operator.pos, ast.USub: operator.neg}

              def visit(node):
                  if isinstance(node, ast.Expression):
                      return visit(node.body)
                  if isinstance(node, ast.Constant) and type(node.value) in (int, float):
                      return node.value
                  if isinstance(node, ast.BinOp) and type(node.op) in operations:
                      left, right = visit(node.left), visit(node.right)
                      if isinstance(node.op, ast.Pow) and abs(right) > 8:
                          raise ValueError("Exponent too large")
                      result = operations[type(node.op)](left, right)
                      if abs(result) > 1e100:
                          raise ValueError("Result too large")
                      return result
                  if isinstance(node, ast.UnaryOp) and type(node.op) in unary:
                      return unary[type(node.op)](visit(node.operand))
                  raise ValueError("Only arithmetic is supported")
              return visit(tree)

          class Windows11App(App):
              def build(self):
                  self.title = "Windows 11"
                  self.notes_file = os.path.join(self.user_data_dir, "notes.txt")
                  Window.clearcolor = BG
                  root = BoxLayout(orientation="vertical",
                                   padding=dp(13), spacing=dp(10))

                  header = BoxLayout(size_hint_y=None, height=dp(58), spacing=dp(6))
                  brand = BoxLayout(orientation="vertical", spacing=dp(1))
                  brand.add_widget(Label(
                      text="[b]Windows 11[/b]", markup=True, color=TEXT,
                      font_size=sp(23), halign="left", valign="middle"))
                  brand.add_widget(Label(
                      text="NovaShell Mobile Edition", color=MUTED,
                      font_size=sp(12), halign="left"))
                  header.add_widget(brand)
                  self.clock_label = Label(text="", color=TEXT,
                                           font_size=sp(13), size_hint_x=.42)
                  header.add_widget(self.clock_label)
                  root.add_widget(header)

                  hero = make_card(orientation="vertical", padding=dp(14),
                                   spacing=dp(4), size_hint_y=None, height=dp(100))
                  hero.add_widget(Label(
                      text="[b]Welcome back[/b]", markup=True,
                      color=TEXT, font_size=sp(21), halign="left"))
                  hero.add_widget(Label(
                      text="A touch-friendly desktop inspired by Windows 11.",
                      color=MUTED, font_size=sp(13), halign="left"))
                  root.add_widget(hero)

                  scroll = ScrollView()
                  grid = GridLayout(cols=2, spacing=dp(9), size_hint_y=None)
                  grid.bind(minimum_height=grid.setter("height"))
                  entries = [
                      ("Calculator", "Math tools", self.open_calculator),
                      ("Notes", "Write and save", self.open_notes),
                      ("Calendar", "Monthly view", self.open_calendar),
                      ("Clock", "Time and date", self.open_clock),
                      ("Timer", "Countdown", self.open_timer),
                      ("About", "App information", self.open_about),
                  ]
                  for name, subtitle, callback in entries:
                      tile = make_card(orientation="vertical", padding=dp(9),
                                       spacing=dp(4), size_hint_y=None, height=dp(116))
                      tile.add_widget(Label(
                          text="[b]" + name + "[/b]", markup=True,
                          color=TEXT, font_size=sp(17)))
                      tile.add_widget(Label(text=subtitle, color=MUTED, font_size=sp(12)))
                      button = Button(text="Open", size_hint_y=None, height=dp(34),
                                      background_normal="", background_color=BLUE,
                                      color=(1, 1, 1, 1), font_size=sp(13))
                      button.bind(on_release=lambda _btn, fn=callback: fn())
                      tile.add_widget(button)
                      grid.add_widget(tile)
                  scroll.add_widget(grid)
                  root.add_widget(scroll)
                  root.add_widget(Label(
                      text="Python • Kivy • Android / ARM64", color=MUTED,
                      size_hint_y=None, height=dp(22), font_size=sp(11)))
                  Clock.schedule_interval(self.update_clock, 1)
                  self.update_clock(0)
                  return root

              def update_clock(self, _dt):
                  if hasattr(self, "clock_label"):
                      self.clock_label.text = datetime.now().strftime("%a\\n%H:%M:%S")

              def show_popup(self, title, content, size=(.92, .82)):
                  Popup(title=title, content=content, size_hint=size).open()

              def open_calculator(self, *_):
                  box = BoxLayout(orientation="vertical", padding=dp(12), spacing=dp(10))
                  entry = TextInput(hint_text="Example: (12 + 8) * 3", multiline=False,
                                    size_hint_y=None, height=dp(50), font_size=sp(18))
                  result = Label(text="Result appears here", color=TEXT, font_size=sp(16))
                  def run(_button):
                      try:
                          result.text = str(calculate(entry.text.strip()))
                      except Exception:
                          result.text = "Invalid expression"
                  button = Button(text="Calculate", size_hint_y=None, height=dp(46),
                                  background_normal="", background_color=BLUE)
                  button.bind(on_release=run)
                  box.add_widget(entry)
                  box.add_widget(button)
                  box.add_widget(result)
                  self.show_popup("Calculator", box)

              def open_notes(self, *_):
                  box = BoxLayout(orientation="vertical", padding=dp(10), spacing=dp(8))
                  editor = TextInput(hint_text="Write notes here…", multiline=True, font_size=sp(16))
                  try:
                      with open(self.notes_file, "r", encoding="utf-8") as file:
                          editor.text = file.read()
                  except FileNotFoundError:
                      pass
                  status = Label(text="", color=GREEN, size_hint_y=None, height=dp(22))
                  def save(_button):
                      with open(self.notes_file, "w", encoding="utf-8") as file:
                          file.write(editor.text)
                      status.text = "Saved on this device"
                  button = Button(text="Save notes", size_hint_y=None, height=dp(44),
                                  background_normal="", background_color=BLUE)
                  button.bind(on_release=save)
                  box.add_widget(editor)
                  box.add_widget(button)
                  box.add_widget(status)
                  self.show_popup("Notes", box, (.94, .88))

              def open_calendar(self, *_):
                  now = datetime.now()
                  box = BoxLayout(orientation="vertical", padding=dp(12), spacing=dp(8))
                  box.add_widget(Label(text=now.strftime("%B %Y"), color=TEXT,
                                       font_size=sp(22), size_hint_y=None, height=dp(40)))
                  box.add_widget(Label(text=calendar.month(now.year, now.month),
                                       color=TEXT, font_size=sp(16)))
                  self.show_popup("Calendar", box, (.92, .70))

              def open_clock(self, *_):
                  box = BoxLayout(orientation="vertical", padding=dp(16), spacing=dp(8))
                  box.add_widget(Label(text=datetime.now().strftime("%H:%M:%S"),
                                       color=TEXT, font_size=sp(32)))
                  box.add_widget(Label(text=datetime.now().strftime("%A, %d %B %Y"),
                                       color=MUTED, font_size=sp(15)))
                  self.show_popup("Clock", box, (.90, .48))

              def open_timer(self, *_):
                  box = BoxLayout(orientation="vertical", padding=dp(12), spacing=dp(10))
                  field = TextInput(hint_text="Seconds (1 to 86400)", multiline=False,
                                    input_filter="int", size_hint_y=None, height=dp(48))
                  display = Label(text="Ready", color=TEXT, font_size=sp(23))
                  state = {"left": 0, "event": None}
                  def tick(_dt):
                      state["left"] -= 1
                      display.text = str(max(0, state["left"])) + " seconds"
                      if state["left"] <= 0:
                          display.text = "Time is up!"
                          state["event"].cancel()
                          state["event"] = None
                  def start(_button):
                      try:
                          seconds = int(field.text)
                          if not 1 <= seconds <= 86400:
                              raise ValueError()
                          if state["event"]:
                              state["event"].cancel()
                          state["left"] = seconds
                          display.text = str(seconds) + " seconds"
                          state["event"] = Clock.schedule_interval(tick, 1)
                      except Exception:
                          display.text = "Enter a valid duration"
                  button = Button(text="Start timer", size_hint_y=None, height=dp(44),
                                  background_normal="", background_color=BLUE)
                  button.bind(on_release=start)
                  box.add_widget(field)
                  box.add_widget(button)
                  box.add_widget(display)
                  self.show_popup("Timer", box, (.90, .60))

              def open_about(self, *_):
                  box = BoxLayout(orientation="vertical", padding=dp(14), spacing=dp(10))
                  box.add_widget(Label(
                      text="NovaShell 11 — Android Edition\\n\\n"
                           "This mobile interface is generated during the build.\\n"
                           "The original Tkinter desktop UI cannot run directly on Android.",
                      color=TEXT, font_size=sp(15)))
                  self.show_popup("About", box)

          if __name__ == "__main__":
              Windows11App().run()
          PY

          cat > android_app/buildozer.spec <<'SPEC'
          [app]
          title = Windows 11
          package.name = windows11
          package.domain = org.novashell
          source.dir = .
          source.include_exts = py,kv,png,jpg,atlas,txt
          version = 1.0.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.api = 35
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

          python -m py_compile android_app/main.py

      - name: Build APK
        working-directory: android_app
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          # minapi=24 is intentional: Android's preadv/pwritev declarations
          # used by recent CPython Android builds require API 24 or newer.
          buildozer -v android debug

      - name: Put APK in apk/Windows_11.apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          APK_PATH="$(find android_app/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "APK not found after build."
            exit 1
          fi
          cp "$APK_PATH" apk/Windows_11.apk
          ls -lh apk/Windows_11.apk

      - name: Save APK into the GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Windows_11.apk
          if git diff --cached --quiet; then
            echo "Repository already has the current APK."
          else
            git commit -m "Build Windows_11.apk"
            git push
          fi

      - name: Upload APK artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: Windows_11
          path: apk/Windows_11.apk
          if-no-files-found: error
          retention-days: 14
